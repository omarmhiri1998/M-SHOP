name: Vercel Production Deployment

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel Project
        working-directory: my-app
        run: vercel link --yes --project m-shop --scope omarmhiri1998s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel Settings
        working-directory: my-app
        run: vercel pull --yes --environment=production --scope omarmhiri1998s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        working-directory: my-app
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        working-directory: my-app
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
